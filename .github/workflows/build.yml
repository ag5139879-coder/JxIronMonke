name: Build JxIronMonke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Prepare
      run: |
        echo "Files in repo root:"
        ls -la
        echo ""
        echo "Source file exists?"
        ls -la src/IronMonkeMod.cs
        echo ""
        echo "Reference DLLs:"
        ls -la MelonLoader.dll UnityEngine.CoreModule.dll UnityEngine.UI.dll

    - name: Build
      run: |
        # Create a clean folder
        rm -rf out
        mkdir out
        cd out

        # Write the project file with absolute-style relative paths from out/
        cat > JxIronMonke.csproj << 'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>disable</ImplicitUsings>
            <Nullable>disable</Nullable>
            <LangVersion>10</LangVersion>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
          </PropertyGroup>

          <ItemGroup>
            <Compile Include="../src/IronMonkeMod.cs" />
          </ItemGroup>

          <ItemGroup>
            <Reference Include="MelonLoader">
              <HintPath>../MelonLoader.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.CoreModule">
              <HintPath>../UnityEngine.CoreModule.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.UI">
              <HintPath>../UnityEngine.UI.dll</HintPath>
              <Private>false</Private>
            </Reference>
          </ItemGroup>
        </Project>
        EOF

        echo "===== csproj ====="
        cat JxIronMonke.csproj
        echo "=================="

        # Build and capture everything
        dotnet build JxIronMonke.csproj -c Release -v n

        echo ""
        echo "===== Searching for output DLL ====="
        find . -type f -name "*.dll"

    - name: Collect DLL
      if: always()
      run: |
        mkdir -p artifact
        # Try common output locations
        cp out/bin/Release/net6.0/JxIronMonke.dll artifact/ 2>/dev/null || true
        cp out/bin/Debug/net6.0/JxIronMonke.dll artifact/ 2>/dev/null || true
        find out -name "JxIronMonke.dll" -exec cp {} artifact/ \; 2>/dev/null || true

        echo "Artifact contents:"
        ls -la artifact/ || echo "artifact folder empty"

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: JxIronMonke-DLL
        path: artifact/
        if-no-files-found: warn
