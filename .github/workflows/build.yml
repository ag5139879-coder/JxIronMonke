name: Build JxIronMonke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Show files
      run: ls -la *.dll

    - name: Create project + build
      run: |
        mkdir -p build
        cd build

        # Create csproj
        cat > JxIronMonke.csproj << 'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>disable</ImplicitUsings>
            <Nullable>disable</Nullable>
            <LangVersion>latest</LangVersion>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
          </PropertyGroup>
          <ItemGroup>
            <Compile Include="IronMonkeMod.cs" />
          </ItemGroup>
          <ItemGroup>
            <Reference Include="MelonLoader">
              <HintPath>../MelonLoader.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.CoreModule">
              <HintPath>../UnityEngine.CoreModule.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.UI">
              <HintPath>../UnityEngine.UI.dll</HintPath>
              <Private>false</Private>
            </Reference>
          </ItemGroup>
        </Project>
        EOF

        # Copy source
        cp ../src/IronMonkeMod.cs .

        # Build
        dotnet build -c Release

        echo "=== Build finished, searching for DLL ==="
        find . -name "*.dll" -type f

    - name: Copy DLL to known location
      run: |
        mkdir -p output
        # The SDK puts it in bin/Release/net6.0/
        if [ -f build/bin/Release/net6.0/JxIronMonke.dll ]; then
          cp build/bin/Release/net6.0/JxIronMonke.dll output/
          echo "Found DLL in standard location"
        else
          # Fallback search
          find build -name "JxIronMonke.dll" -exec cp {} output/ \;
          echo "Used fallback search"
        fi
        ls -la output/

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: JxIronMonke-DLL
        path: output/JxIronMonke.dll
        if-no-files-found: error
