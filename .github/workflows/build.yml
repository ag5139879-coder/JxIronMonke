name: Build JxIronMonke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: List DLLs
      run: |
        echo "=== All DLLs in repo ==="
        find . -maxdepth 1 -name "*.dll" -type f

    - name: Build net472
      run: |
        mkdir -p out
        cd out

        REFS=""
        for dll in MelonLoader.dll UnityEngine.CoreModule.dll Il2Cppmscorlib.dll UnhollowerBaseLib.dll UnityEngine.PhysicsModule.dll; do
          if [ -f "../$dll" ]; then
            name=$(basename "$dll" .dll)
            echo "Adding: $name"
            REFS="$REFS
            <Reference Include=\"$name\">
              <HintPath>../$dll</HintPath>
              <Private>false</Private>
            </Reference>"
          fi
        done

        cat > JxIronMonke.csproj << EOF
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net472</TargetFramework>
            <LangVersion>9</LangVersion>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
          </PropertyGroup>
          <ItemGroup>
            <Compile Include="../src/IronMonkeMod.cs" />
          </ItemGroup>
          <ItemGroup>
        $REFS
          </ItemGroup>
        </Project>
        EOF

        echo "===== csproj ====="
        cat JxIronMonke.csproj

        dotnet build JxIronMonke.csproj -c Release -v n

        find . -name "JxIronMonke.dll" -type f

    - name: Collect
      if: always()
      run: |
        mkdir -p artifact
        find out -name "JxIronMonke.dll" -exec cp {} artifact/ \; || true
        ls -la artifact/ || true

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: JxIronMonke-DLL
        path: artifact/JxIronMonke.dll
        if-no-files-found: warn
