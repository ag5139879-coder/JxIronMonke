name: Build JxIronMonke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: List available DLLs
      run: |
        echo "=== Root DLLs ==="
        ls -la *.dll || true

    - name: Create project
      run: |
        mkdir -p build/JxIronMonke
        cd build/JxIronMonke

        cat > JxIronMonke.csproj << 'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>disable</ImplicitUsings>
            <Nullable>disable</Nullable>
            <LangVersion>latest</LangVersion>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath>
            <OutputPath>bin/Release/</OutputPath>
          </PropertyGroup>
          <ItemGroup>
            <Compile Include="IronMonkeMod.cs" />
          </ItemGroup>
          <ItemGroup>
            <Reference Include="MelonLoader">
              <HintPath>../../MelonLoader.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.CoreModule">
              <HintPath>../../UnityEngine.CoreModule.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.UI">
              <HintPath>../../UnityEngine.UI.dll</HintPath>
              <Private>false</Private>
            </Reference>
          </ItemGroup>
        </Project>
        EOF

    - name: Copy source
      run: |
        cp src/IronMonkeMod.cs build/JxIronMonke/

    - name: Build
      run: |
        cd build/JxIronMonke
        dotnet build -c Release
        echo "=== Looking for output ==="
        find . -name "*.dll" -type f
        ls -laR bin/ || true

    - name: Prepare artifact
      run: |
        mkdir -p artifact
        # Copy the built mod DLL (prefer the one we just built)
        find build -name "JxIronMonke.dll" -type f -exec cp {} artifact/ \;
        # Fallback: any DLL that isn't a reference
        if [ ! -f artifact/JxIronMonke.dll ]; then
          find build -name "*.dll" -type f ! -name "MelonLoader.dll" ! -name "UnityEngine*" -exec cp {} artifact/JxIronMonke.dll \;
        fi
        ls -la artifact/

    - name: Upload built DLL
      uses: actions/upload-artifact@v4
      with:
        name: JxIronMonke-DLL
        path: artifact/JxIronMonke.dll
        if-no-files-found: error
