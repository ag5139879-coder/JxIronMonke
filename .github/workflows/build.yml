name: Build JxIronMonke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: List available DLLs
      run: |
        echo "=== Root DLLs ==="
        ls -la *.dll || true
        echo "=== refs folder ==="
        ls -la refs/ || true

    - name: Create project
      run: |
        mkdir -p build/JxIronMonke
        cd build/JxIronMonke

        cat > JxIronMonke.csproj << 'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>disable</ImplicitUsings>
            <Nullable>disable</Nullable>
            <LangVersion>latest</LangVersion>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
          </PropertyGroup>
          <ItemGroup>
            <Compile Include="IronMonkeMod.cs" />
          </ItemGroup>
          <ItemGroup>
            <Reference Include="MelonLoader">
              <HintPath>../../MelonLoader.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.CoreModule">
              <HintPath>../../UnityEngine.CoreModule.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.UI">
              <HintPath>../../UnityEngine.UI.dll</HintPath>
              <Private>false</Private>
            </Reference>
          </ItemGroup>
        </Project>
        EOF

        cat JxIronMonke.csproj

    - name: Copy source
      run: |
        cp src/IronMonkeMod.cs build/JxIronMonke/
        ls -la build/JxIronMonke/

    - name: Build
      run: |
        cd build/JxIronMonke
        dotnet restore
        dotnet build -c Release --verbosity detailed 2>&1 | tee build.log
        echo "=== BUILD LOG END ==="
        cat build.log

    - name: Upload built DLL
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: JxIronMonke-Build
        path: |
          build/JxIronMonke/bin/Release/net6.0/JxIronMonke.dll
          build/JxIronMonke/build.log
        if-no-files-found: warn
