name: Build JxIronMonke

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Create project
      run: |
        mkdir -p build
        cd build
        dotnet new classlib -n JxIronMonke -f net6.0 --force
        rm JxIronMonke/Class1.cs

    - name: Copy source
      run: |
        cp src/IronMonkeMod.cs build/JxIronMonke/

    - name: Add MelonLoader reference (placeholder)
      run: |
        cd build/JxIronMonke
        # We expect the user to upload MelonLoader.dll and Unity DLLs into a 'refs' folder
        if [ -d "../../refs" ]; then
          echo "Found refs folder"
          ls ../../refs
        else
          echo "No refs folder found - build may fail without MelonLoader.dll"
        fi

    - name: Build
      run: |
        cd build/JxIronMonke
        # Try to reference any DLLs the user uploaded to /refs
        if [ -d "../../refs" ]; then
          for dll in ../../refs/*.dll; do
            echo "Adding reference: $dll"
            dotnet add reference "$dll" || true
          done
        fi
        dotnet build -c Release

    - name: Upload built DLL
      uses: actions/upload-artifact@v4
      with:
        name: JxIronMonke-Build
        path: build/JxIronMonke/bin/Release/net6.0/JxIronMonke.dll
        if-no-files-found: warn
