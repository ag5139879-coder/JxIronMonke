name: Build JxIronMonke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: List DLLs
      run: |
        echo "=== All DLLs in repo ==="
        find . -name "*.dll" -type f

    - name: Build
      run: |
        mkdir -p out
        cd out

        # Build list of references dynamically
        REFS=""
        for dll in MelonLoader.dll UnityEngine.CoreModule.dll UnityEngine.UI.dll Il2Cppmscorlib.dll UnityEngine.PhysicsModule.dll UnityEngine.TextRenderingModule.dll UnityEngine.UIModule.dll; do
          if [ -f "../$dll" ]; then
            echo "Found $dll"
            REFS="$REFS
            <Reference Include=\"${dll%.*}\">
              <HintPath>../$dll</HintPath>
              <Private>false</Private>
            </Reference>"
          fi
        done

        cat > JxIronMonke.csproj << EOF
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>disable</ImplicitUsings>
            <Nullable>disable</Nullable>
            <LangVersion>10</LangVersion>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
          </PropertyGroup>
          <ItemGroup>
            <Compile Include="../src/IronMonkeMod.cs" />
          </ItemGroup>
          <ItemGroup>
        $REFS
          </ItemGroup>
        </Project>
        EOF

        echo "===== csproj ====="
        cat JxIronMonke.csproj
        echo "=================="

        dotnet build JxIronMonke.csproj -c Release -v n

        echo ""
        echo "=== Output DLLs ==="
        find . -name "*.dll" -type f

    - name: Collect
      if: always()
      run: |
        mkdir -p artifact
        find out -name "JxIronMonke.dll" -exec cp {} artifact/ \; || true
        ls -la artifact/ || true

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: JxIronMonke-DLL
        path: artifact/JxIronMonke.dll
        if-no-files-found: warn
