name: Build JxIronMonke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Create project
      run: |
        mkdir -p build/JxIronMonke
        cd build/JxIronMonke

        # Create a proper csproj that references the DLLs
        cat > JxIronMonke.csproj << 'EOF'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>disable</ImplicitUsings>
            <Nullable>disable</Nullable>
            <LangVersion>latest</LangVersion>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
          </PropertyGroup>
          <ItemGroup>
            <Reference Include="MelonLoader">
              <HintPath>../../MelonLoader.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.CoreModule">
              <HintPath>../../UnityEngine.CoreModule.dll</HintPath>
              <Private>false</Private>
            </Reference>
            <Reference Include="UnityEngine.UI">
              <HintPath>../../UnityEngine.UI.dll</HintPath>
              <Private>false</Private>
            </Reference>
          </ItemGroup>
        </Project>
        EOF

    - name: Copy source
      run: |
        cp src/IronMonkeMod.cs build/JxIronMonke/

    - name: Build
      run: |
        cd build/JxIronMonke
        dotnet build -c Release --verbosity normal

    - name: Upload built DLL
      uses: actions/upload-artifact@v4
      with:
        name: JxIronMonke-Build
        path: build/JxIronMonke/bin/Release/net6.0/JxIronMonke.dll
        if-no-files-found: error
